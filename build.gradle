plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.4'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'com.vladmihalcea:hibernate-types-60:2.20.0'
    implementation("io.jsonwebtoken:jjwt-api:0.12.5")
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.12.5")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.12.5")
    implementation 'com.amazonaws:aws-java-sdk-s3:1.11.1003'
    implementation 'com.amazonaws:aws-java-sdk-secretsmanager:1.12.326'
    implementation 'com.amazonaws:aws-java-sdk-sts:1.12.350'
    api 'com.amazonaws:aws-java-sdk-sts:1.12.350'
    implementation 'org.json:json:20171018'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly("org.projectlombok:lombok:1.18.24")
    annotationProcessor("org.projectlombok:lombok:1.18.24")
    runtimeOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'
description = 'ResumeBuilder'
java.sourceCompatibility = JavaVersion.VERSION_17

bootJar {
    mainClass = 'com.project.ResumeBuilder.ResumeBuilderApplication'
}

ext {
    springCloudVersion = '2023.0.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
