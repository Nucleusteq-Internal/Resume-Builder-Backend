 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.org.springframework.boot.spring.boot.starter.data.jpa
    api libs.org.springframework.boot.spring.boot.starter.security
    api libs.org.springframework.security.spring.security.config
    api libs.org.springframework.security.spring.security.web
    api libs.org.springframework.boot.spring.boot.starter.web
    api libs.org.springframework.boot.spring.boot.starter.validation
    api libs.com.vladmihalcea.hibernate.types.v60
    api libs.io.jsonwebtoken.jjwt.api
    api libs.org.springframework.boot.spring.boot.starter.mail
    runtimeOnly libs.org.springframework.boot.spring.boot.devtools
    runtimeOnly libs.org.postgresql.postgresql
    runtimeOnly libs.io.jsonwebtoken.jjwt.impl
    runtimeOnly libs.io.jsonwebtoken.jjwt.jackson
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
    compileOnly libs.org.projectlombok.lombok
    annotationProcessor libs.org.projectlombok.lombok
    implementation 'com.amazonaws:aws-java-sdk-s3:1.11.1003'
//    implementation 'com.amazonaws:aws-java-sdk-secretsmanager:1.11.955'

    implementation 'com.amazonaws:aws-java-sdk-secretsmanager:1.12.326'
    implementation 'com.amazonaws:aws-java-sdk-sts:1.12.350'
    api 'com.amazonaws:aws-java-sdk-sts:1.12.350'
    implementation 'org.json:json:20171018'
//    implementation 'software.amazon.awssdk:eks'
//    implementation 'org.json.json:20210307'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'
description = 'ResumeBuilder'
java.sourceCompatibility = JavaVersion.VERSION_17

bootJar {
    mainClass = 'com.project.ResumeBuilder.ResumeBuilderApplication'
}
ext {
    springCloudVersion = '2023.0.0'
}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
